plugins { id 'fabric-loom' version '1.9-SNAPSHOT'; id 'maven-publish' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
// The tested, Minecraft-free logic lives in ../core and is compiled into the mod.
sourceSets { main { java { srcDir '../../core/src/main/java' } } }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
processResources {
    inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version }
    // One copy of the sky themes and built-in emotes, shared with the launcher.
    from("../../../visuals") { include "themes.json", "emotes.json", "design-tokens.json"; into "assets/auroras_client" }
}
