# Builds everything on GitHub's computers and publishes a release, so nobody has to build anything locally.
# Runs on every push to main (and from the Actions tab). The release holds:
#   AurorasClientSetup-<version>.exe       the Windows installer
#   auroras-client-fabric-<mc>.jar         the Auroras mod, one per adapter folder (the launcher installs it by itself)
#   SHA256SUMS.txt                         checksums the launcher checks every download against
# Optional: set a repository variable AZURE_CLIENT_ID (Settings > Secrets and variables > Actions > Variables) so the
# installer ships with Microsoft sign-in ready to use, and FRIENDS_URL (https address of your friends-server) for Friends.
# Third-party steps are pinned to exact commits (tag in the comment) of open-source actions from GitHub (actions/*),
# Gradle (gradle/actions) and softprops/action-gh-release (MIT), so a moved tag can't change what runs.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - name: Launcher tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Mod logic tests (core)
        working-directory: client-mod/core
        run: |
          java Build.java
          for t in Tests PerfTests VisualTests HudTests EmoteTests UiTests ModuleTests; do java -cp out gg.auroras.core.$t ../../visuals; done

  mod:
    # Builds the Auroras mod once per Minecraft target (client-mod/adapters/mojmap/targets). Each target is separate: if
    # one fails, the others and the launcher are still released, and that job's log in the Actions tab says why.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: ["1.21.11", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "9.7.1" }
      - run: node scripts/ci-release.js "${{ github.repository }}" "${{ github.run_number }}"
      - name: Build for Minecraft ${{ matrix.target }}
        working-directory: client-mod/adapters/mojmap
        run: gradle build --no-daemon --stacktrace -Ptarget=${{ matrix.target }}
      - name: Name the jar
        run: |
          mkdir -p out
          jar=$(ls client-mod/adapters/mojmap/build/${{ matrix.target }}/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$jar" "out/auroras-client-fabric-${{ matrix.target }}.jar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "mod-${{ matrix.target }}", path: out/*.jar }

  app:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - id: stamp
        run: node scripts/ci-release.js "${{ github.repository }}" "${{ github.run_number }}"
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          FRIENDS_URL: ${{ vars.FRIENDS_URL }}
      - run: npm install --no-audit --no-fund
      - run: python scripts/build-renderer.py
      - run: npx electron-builder --win nsis --publish never
      - name: Name the installer
        shell: bash
        run: |
          mkdir -p out
          cp "$(ls dist/*.exe | head -n 1)" "out/AurorasClientSetup-${{ steps.stamp.outputs.version }}.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: app, path: out/*.exe }

  release:
    needs: [app, mod]
    if: ${{ always() && needs.app.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          {
            echo "Download **AurorasClientSetup-${{ needs.app.outputs.version }}.exe** below and run it."
            echo
            jars=$(cd files && ls auroras-client-fabric-*.jar 2>/dev/null | sed 's/auroras-client-fabric-//; s/\.jar$//' | sort -V | tr '\n' ' ')
            if [ -n "$jars" ]; then echo "The Auroras mod is included for Minecraft: $jars(Fabric). The launcher installs it when you press Play on a Fabric instance of one of these versions."
            else echo "The Auroras mod didn't build in this release, so Fabric instances start without it. See the mod jobs in the Actions tab."; fi
          } > notes.md && cat notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.app.outputs.version }}
          name: Auroras Client ${{ needs.app.outputs.version }}
          make_latest: true
          body_path: notes.md
          files: files/*
