# Compiles the Auroras mod for every Minecraft target without releasing anything (release.yml publishes on main).
# Runs on pushes to the mod-fix branch and from the Actions tab. Same steps and pinned actions as release.yml's mod job,
# plus a javap dump of the classes in ci/javap-classes.txt so the real Minecraft names can be read in the log.
name: Mod compile check

on:
  push:
    branches: [mod-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["1.21.11", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "9.7.1" }
      - run: node scripts/ci-release.js "${{ github.repository }}" "${{ github.run_number }}"
      - name: Build for Minecraft ${{ matrix.target }}
        working-directory: client-mod/adapters/mojmap
        run: gradle build --no-daemon --stacktrace -Ptarget=${{ matrix.target }}
      - name: Minecraft names (javap)
        if: always()
        working-directory: client-mod/adapters/mojmap
        run: |
          classes=$(grep -v '^#' ../../../ci/javap-classes.txt | grep . | paste -sd, -)
          code=$(grep -v '^#' ../../../ci/javap-code.txt | grep . | paste -sd, -)
          gradle mcJavap --no-daemon -q -Ptarget=${{ matrix.target }} "-PjavapClasses=$classes" "-PjavapCode=$code"
