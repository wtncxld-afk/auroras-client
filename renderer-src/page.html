<!DOCTYPE html>
<html lang="en" data-theme="aurora-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auroras Launcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/*@tokens*/
:root{--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--glow1:rgba(143,211,255,.16);--glow2:rgba(167,139,250,.12);--glow3:rgba(95,208,214,.10)}
[data-theme=midnight]{--bg:#07090f;--side:#0a0d16;--s1:#10142199;--s1:#101421;--s2:#161b2b;--line:#1d2438;--acc:#7c9cff;--acc2:#6aa8ff;--vio:#b39dff;--glow1:rgba(124,156,255,.18);--glow2:rgba(179,157,255,.10);--glow3:rgba(106,168,255,.08)}
[data-theme=arctic]{--bg:#0c1115;--side:#10171c;--s1:#151d23;--s2:#1b252d;--line:#25313b;--acc:#b8ecff;--acc2:#7fe3e0;--vio:#9fb4ff;--glow1:rgba(184,236,255,.16);--glow2:rgba(159,180,255,.08);--glow3:rgba(127,227,224,.12)}
[data-theme=nebula]{--bg:#0e0b16;--side:#130f1d;--s1:#191427;--s2:#21192f;--line:#2d2340;--acc:#c4a6ff;--acc2:#ff9bd1;--vio:#9d7cff;--glow1:rgba(196,166,255,.18);--glow2:rgba(255,155,209,.10);--glow3:rgba(157,124,255,.12)}
[data-theme=sunset]{--bg:#120c0c;--side:#171010;--s1:#1e1514;--s2:#271b19;--line:#37251f;--acc:#ffb38a;--acc2:#ff8fa3;--vio:#e5a0ff;--acc-ink:#1f0e05;--glow1:rgba(255,179,138,.17);--glow2:rgba(255,143,163,.10);--glow3:rgba(229,160,255,.08)}
[data-theme=forest]{--bg:#0a0f0d;--side:#0e1512;--s1:#131c18;--s2:#18241f;--line:#22322b;--acc:#8fe3b0;--acc2:#6fcf97;--vio:#9ad0c0;--glow1:rgba(143,227,176,.15);--glow2:rgba(154,208,192,.09);--glow3:rgba(111,207,151,.10)}
[data-theme=light]{--bg:#f5f7fa;--side:#eceff4;--s1:#ffffff;--s2:#f0f2f6;--line:#dde2eb;--text:#161a23;--mute:#667085;--acc:#2a6fa8;--acc-ink:#fff;--acc2:#1f9aa3;--vio:#7c5cd6;--ok:#2f8f5b;--warn:#a87a1c;--err:#c24444;--glow1:rgba(47,127,193,.14);--glow2:rgba(124,92,214,.08);--glow3:rgba(31,154,163,.08)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;font:400 13px/1.5 var(--font);letter-spacing:-.003em;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background var(--t),color var(--t)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r-s)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
.app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:36px 1fr;height:100%}
.titlebar{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--side);border-bottom:1px solid var(--line);color:var(--mute);font-size:12px}
.titlebar b{font-weight:500;color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--vio))}
.side{width:212px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;gap:2px;overflow-y:auto;transition:width 200ms}
.side.mini{width:56px}
.grp{font-size:11px;color:var(--mute);padding:14px 10px 4px;white-space:nowrap;overflow:hidden}
.side.mini .grp{height:10px;padding:0;margin:6px 8px 0;border-top:1px solid var(--line);font-size:0}
.side.mini .grp:first-of-type{border:0}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-s);color:var(--mute);width:100%;text-align:left;position:relative;white-space:nowrap;transition:background var(--t),color var(--t)}
.nav:hover{background:var(--s2);color:var(--text)}
.nav[aria-current=page]{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,var(--s2)),var(--s2));color:var(--text)}.nav[aria-current=page] svg{color:var(--acc)}
.nav[aria-current=page]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.side.mini .nav span{display:none}
.side.mini .nav:hover::after{content:attr(data-tip);position:fixed;left:62px;background:var(--s2);border:1px solid var(--line);color:var(--text);padding:3px 8px;border-radius:var(--r-s);font-size:12px;z-index:30}
.grow{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-m);width:100%;text-align:left;transition:background var(--t)}
.acct:hover{background:var(--s2)}
.side.mini .acct div{display:none}
.avatar{width:28px;height:28px;border-radius:var(--r-s);background:linear-gradient(135deg,var(--acc2),var(--vio));display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--acc-ink);flex:none}
/* Sidebar: a soft glass column with an aurora glow at the top, icon tiles, and an accent-lit active page. */
.side.side{padding:10px 10px 12px;gap:1px;background:radial-gradient(120% 40% at 0% 0%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--side) 82%,transparent),color-mix(in srgb,var(--side) 92%,transparent));border-right:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:inset -1px 0 0 rgba(255,255,255,.03)}
.sbrand{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;margin-bottom:2px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}.sbrand .logo{height:24px;filter:drop-shadow(0 0 10px var(--glow1))}
.sbrand span{display:grid;line-height:1.1;white-space:nowrap}.sbrand b{font-weight:650;letter-spacing:-.01em;font-size:15px}.sbrand small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.side .grp{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--mute) 75%,transparent);padding:16px 10px 6px}
.side .nav{height:38px;padding:0 8px;gap:11px;border-radius:11px;font-weight:500;transition:background var(--t),color var(--t),transform var(--t-fast,90ms)}
.nic{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--s2) 70%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);transition:background var(--t),border-color var(--t),box-shadow var(--t),color var(--t)}.nic svg{width:15px;height:15px}
.side .nav:hover{background:color-mix(in srgb,var(--s2) 70%,transparent)}.side .nav:hover .nic{border-color:var(--line-strong,var(--mute));color:var(--text)}.side .nav:active{transform:scale(.98)}
.side .nav[aria-current=page]{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 20%,transparent),color-mix(in srgb,var(--acc) 4%,transparent));color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent)}
.side .nav[aria-current=page] .nic{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));border-color:transparent;color:var(--acc-ink);box-shadow:0 4px 14px -4px var(--acc)}.side .nav[aria-current=page] svg{color:var(--acc-ink)}
.side .nav[aria-current=page]::before{left:-10px;top:10px;bottom:10px}
.side #collapse{color:var(--mute);margin-top:6px}
.side .acct{margin-top:6px;padding:8px;border-radius:14px;background:color-mix(in srgb,var(--s1) 70%,transparent);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.side .acct:hover{border-color:var(--line-strong,var(--mute));background:color-mix(in srgb,var(--s2) 75%,transparent)}
.side .acct small{color:var(--mute)}.side .acct .av,.side .acct img{border-radius:9px}
.side.mini .sbrand span{display:none}.side.mini .sbrand{justify-content:center;padding:6px 0 12px}.side.mini .nav{justify-content:center;padding:0}.side.mini .acct{justify-content:center;padding:6px}
.min{min-width:0}.min b,.min small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:var(--mute);font-size:12px}
main{position:relative;overflow-y:auto;min-width:0}
.page{max-width:980px;margin:0 auto;padding:28px 32px 96px;animation:in 180ms ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
h1{font-size:20px;font-weight:500;letter-spacing:-.02em}
h2{font-size:13px;font-weight:500;margin-bottom:10px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
.hero{position:relative;border-radius:var(--r-l);padding:44px 36px 32px;margin-bottom:28px;overflow:hidden;border:1px solid var(--line);background:var(--s1)}
.hero::before,.hero::after{content:"";position:absolute;inset:-40%;pointer-events:none;background:radial-gradient(40% 30% at 30% 40%,var(--glow1),transparent 70%),radial-gradient(35% 28% at 70% 30%,var(--glow2),transparent 70%),radial-gradient(40% 25% at 55% 75%,var(--glow3),transparent 70%);animation:drift 28s ease-in-out infinite alternate}
.hero::after{animation-duration:41s;animation-direction:alternate-reverse;opacity:.7}
@keyframes drift{to{transform:translate3d(6%,4%,0) rotate(6deg)}}
.hero>*{position:relative}
.wm{font-size:44px;line-height:1.05;font-weight:500;letter-spacing:-.04em}
.hero p{color:var(--mute);margin-top:8px;max-width:46ch}
.launch{display:flex;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:var(--r-s);display:inline-flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);font-weight:500;transition:background var(--t),transform 90ms,border-color var(--t)}
.btn:hover{border-color:var(--mute)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
/* Buttons with a little depth: a soft top light, a hairline edge and a short shadow; primary buttons glow in the accent. */
.btn{border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--s2) 90%,#fff 10%),var(--s2));border-color:color-mix(in srgb,var(--line) 85%,#fff 8%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.22)}
.btn:hover{border-color:var(--line-strong,var(--mute));background:linear-gradient(180deg,color-mix(in srgb,var(--s2) 84%,#fff 16%),var(--s2))}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 86%,#fff),var(--acc));border-color:color-mix(in srgb,var(--acc) 75%,#000);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 16px -6px var(--acc)}
.btn.pri:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 22px -6px var(--acc)}
.btn.play{height:52px;padding:0 30px;font-size:16px;font-weight:600;letter-spacing:.01em;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 88%,#fff),var(--acc) 45%,color-mix(in srgb,var(--acc) 62%,#8b5cf6));box-shadow:0 12px 34px -12px var(--acc),inset 0 1px 0 rgba(255,255,255,.4);transition:transform var(--t),box-shadow var(--t),filter var(--t)}
.btn.play:hover{transform:translateY(-1px);box-shadow:0 16px 40px -12px var(--acc),inset 0 1px 0 rgba(255,255,255,.45)}.btn.play:active{transform:translateY(0)}
.sel{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:var(--r-m);background:color-mix(in srgb,var(--s2) 80%,transparent);border:1px solid var(--line);min-width:230px;max-width:100%;text-align:left;transition:border-color var(--t)}
.sel:hover,.sel[aria-expanded=true]{border-color:var(--mute)}
.sel .min{flex:1}
.ico{width:28px;height:28px;border-radius:var(--r-s);display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--s2);border:1px solid var(--line);flex:none}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
@media(max-width:760px){.cols{grid-template-columns:1fr}.page{padding:20px 16px 96px}.hero{padding:28px 20px}.wm{font-size:34px}.side{width:56px}.side .nav span,.side .acct div{display:none}.side .grp{font-size:0;height:10px;padding:0}}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-m)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-s);width:100%;text-align:left;transition:background var(--t)}
.row:hover{background:var(--s2)}
.list{padding:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.srv{padding:var(--sp-4);display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-3);align-content:start;min-width:0}.homegrid>section{min-width:0}.srv .top .min{flex:1}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--sp-5);align-items:start}.homegrid h2{color:var(--mute);font-weight:500}
.sico{width:40px;height:40px;border-radius:var(--r-s);image-rendering:pixelated;flex:none}
.srvst{display:flex!important;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sdot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}.sdot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}.sdot.bad{background:var(--err)}.sdot.wait{background:var(--warn)}
.spin.sm{width:11px;height:11px;border-width:1.5px}
.motd{font-size:var(--fs-sm);color:var(--mute);white-space:pre-line;line-height:1.45;overflow-wrap:anywhere;padding:var(--sp-2) var(--sp-3);background:var(--bg);border-radius:var(--r-s);border:1px solid var(--line)}
.srvrow{display:flex;align-items:center;gap:var(--sp-2)}.srvrow .addr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 var(--fs-sm)/1 ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.srvform{display:flex;gap:var(--sp-2)}.srv .top small{white-space:normal}.srv .top .srvst{white-space:nowrap;overflow:hidden}.srv .top .srvst{align-items:flex-start;white-space:normal}.srvst .sdot{margin-top:5px}.srvst .sttx{min-width:0;white-space:normal;line-height:1.4}.motd>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.srvst .sttx .spin{vertical-align:-2px;margin-right:6px}
.news .row{gap:var(--sp-3)}.news b{font-weight:500;white-space:normal;display:block}.dotk{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-top:7px;flex:none;opacity:.8}
.srv .top{display:flex;align-items:center;gap:12px}
.srv .ico{width:40px;height:40px;background:linear-gradient(135deg,var(--vio),var(--acc2));color:var(--acc-ink);border:0;font-size:15px}
input.f{width:100%;height:32px;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--line);padding:0 10px;transition:border-color var(--t)}
input.f:focus{border-color:var(--acc);outline:0}
input.f::placeholder{color:var(--mute)}
.search{position:relative}.search svg{position:absolute;left:10px;top:8px;color:var(--mute)}.search input{padding-left:32px}
.news{display:grid;gap:2px;padding:4px}
.news .row{align-items:flex-start}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:72px 20px;color:var(--mute)}
.empty .ring{width:44px;height:44px;border-radius:var(--r-m);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:6px;background:var(--s1)}
.empty b{color:var(--text);font-weight:500;font-size:14px}
.bar{position:fixed;left:calc(50% + 106px);transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border-radius:var(--r-l);background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);z-index:5;box-shadow:0 10px 30px -12px #000}
.bar .sel{height:36px;min-width:190px;background:transparent;border:0}
.bar .btn{height:36px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.th{border-radius:var(--r-m);border:1px solid var(--line);background:var(--s1);padding:8px;text-align:left;transition:border-color var(--t)}
.th:hover{border-color:var(--mute)}
.th[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pv{height:64px;border-radius:var(--r-s);position:relative;overflow:hidden;margin-bottom:8px;border:1px solid #ffffff10}
.pv i{position:absolute;left:0;top:0;bottom:0;width:22%}
.pv b{position:absolute;right:10px;bottom:10px;width:34px;height:10px;border-radius:5px}
.th span{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.tg{width:38px;height:22px;border-radius:99px;background:color-mix(in srgb,var(--bg) 55%,var(--s2));border:1px solid var(--line);position:relative;transition:background var(--t);flex:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--mute) 70%,#fff);box-shadow:0 1px 3px rgba(0,0,0,.45);transition:transform var(--t) var(--ease,ease),background var(--t)}
.tg[aria-checked=true]{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));border-color:transparent;box-shadow:0 0 12px -3px var(--acc)}.tg[aria-checked=true]::after{transform:translateX(16px);background:#fff}
.pop{position:fixed;width:320px;max-width:calc(100vw - 24px);background:var(--s1);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 18px 50px -10px #000a;z-index:40;padding:8px;animation:pop 140ms ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}}
.pop .scroll{max-height:240px;overflow-y:auto;margin:8px -2px}
.pop .row[aria-selected=true]{background:var(--s2)}
.pop .check{margin-left:auto;color:var(--acc)}
.toast{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--s2);border:1px solid var(--line);padding:10px 14px;border-radius:var(--r-m);max-width:320px;animation:pop 160ms ease-out;box-shadow:0 12px 30px -10px #000a}
.tot{display:grid;grid-template-columns:64px auto 220px;gap:20px;align-items:start;justify-content:start}
@media(max-width:860px){.tot{grid-template-columns:1fr}.tb{flex-direction:row!important;flex-wrap:wrap}}
.tb{display:flex;flex-direction:column;gap:2px;padding:6px}
.tb{align-items:center}.tb .ibtn{position:relative}.tbsep{display:block;width:20px;height:1px;background:var(--line);margin:4px 0}
[data-tt]::after{content:attr(data-tt);position:absolute;left:calc(100% + 8px);top:50%;transform:translate(-4px,-50%);white-space:nowrap;padding:4px 8px;border-radius:var(--r-s);background:var(--s3);border:1px solid var(--line-strong);color:var(--text);font-size:var(--fs-sm);box-shadow:var(--sh-pop);opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);z-index:80}
[data-tt]:hover::after,[data-tt]:focus-visible::after{opacity:1;transform:translate(0,-50%)}
@media(max-width:1000px){.tbsep{width:1px;height:20px;margin:0 4px}[data-tt]::after{left:50%;top:auto;bottom:calc(100% + 8px);transform:translate(-50%,4px)}[data-tt]:hover::after,[data-tt]:focus-visible::after{transform:translate(-50%,0)}}
.tb .btn{height:30px;padding:0 6px;justify-content:center;font-size:12px;border-color:transparent;background:transparent;color:var(--mute)}
.tb .btn:hover{background:var(--s2);color:var(--text)}
.tb .btn[aria-pressed=true]{background:var(--s2);color:var(--text);border-color:var(--line)}
canvas#cv{display:block;border-radius:var(--r-m);border:1px solid var(--line);touch-action:none;cursor:crosshair;max-width:100%}

else if(t.dataset.cfgv!==undefined){const i=t.dataset.cfgv.indexOf(":"),p=t.dataset.cfgv.slice(0,i),v=t.dataset.cfgv.slice(i+1);cfgSet(p,v);if(p==="snd.style")SFX.play("click",v);if(p.startsWith("bg."))bgApply();render()}
else if(t.dataset.save){const out=document.getElementById({ms:"msres",sp:"spres",fr:"frres"}[t.dataset.save]||"updres");if(t.dataset.save==="fr")FR.checked=false;if(!(window.auroras&&auroras.setSettings))return void(out.textContent="Saving needs the desktop app.");
try{await auroras.setSettings(t.dataset.save==="ms"?{msClientId:document.getElementById("msid").value}:t.dataset.save==="fr"?{friendsUrl:document.getElementById("frurl").value.trim()}:t.dataset.save==="sp"?{spotifyClientId:document.getElementById("spid").value}:{updateUrl:document.getElementById("updurl").value.trim()});out.className="";out.innerHTML="<small>Saved.</small>"}catch(err){out.className="err";out.textContent=errMsg(err)}}
else if(t.hasAttribute("data-checkupd"))updCheck(false);
else if(t.hasAttribute("data-compat"))openCompat();
else if(t.hasAttribute("data-spconnect")||t.hasAttribute("data-spdisc")){const out=document.getElementById("spres");if(!(window.auroras&&auroras.spotifyConnect)){out.innerHTML="<small>Connecting Spotify needs the desktop app.</small>";return}
try{if(t.hasAttribute("data-spdisc")){await auroras.spotifyDisconnect();out.innerHTML="<small>Spotify disconnected.</small>"}else{out.innerHTML="<small>Finish signing in in your browser…</small>";await auroras.spotifyConnect();out.innerHTML="<small>Spotify connected. The Spotify HUD will show your current track while you play.</small>"}}catch(err){out.className="err";out.textContent=errMsg(err)}}
else if(t.hasAttribute("data-instclient")){const out=document.getElementById("updres"),b=window.__clientBuild;if(!b)return;t.disabled=true;out.insertAdjacentHTML("beforeend",`<div id="ip"><small>Downloading and verifying…</small></div>`);
try{const r=await auroras.updateInstallClient({instId:cur().id,build:b}),ip=document.getElementById("ip");ip.innerHTML=r.ok?`<b style="font-weight:500">Installed Auroras Client ${esc(r.version)}.</b> <small>Restart Minecraft to use it.</small>`:`<div class="err">Update failed: ${esc(r.error)}${r.restored?" Your previous version was restored.":""}</div>`}catch(err){const ip=document.getElementById("ip");if(ip)ip.innerHTML=`<div class="err">${esc(errMsg(err))}</div>`}t.disabled=false}});
/* Auto-update: the desktop app downloads and verifies a newer launcher in the background, then this asks to restart. */
function showUpdReady(u){if(!u||document.getElementById("updmodal"))return;const d=document.createElement("div");d.id="updmodal";d.className="mb";
d.innerHTML=`<div class="dlg upd-dlg" role="dialog" aria-modal="true" aria-label="Update ready" style="width:440px"><div class="body" style="min-height:0;text-align:center;padding:26px 24px 18px"><div class="upd-ico">${ic("download",26)}</div><h1 style="font-size:18px;margin:12px 0 4px">Update ready</h1><small style="display:block">Auroras Client ${esc(u.version)} is downloaded and checked. Restart the launcher to finish updating.</small>${u.notes?`<details style="margin-top:12px;text-align:left"><summary style="cursor:pointer;color:var(--mute);font-size:var(--fs-sm)">What’s new</summary><small style="display:block;white-space:pre-wrap;margin-top:6px;max-height:160px;overflow:auto">${esc(u.notes)}</small></details>`:""}<div class="err" id="upd-err" role="alert" style="margin-top:8px"></div></div><footer style="justify-content:center;gap:10px"><button class="btn" data-updlater>Later</button><button class="btn pri" data-updnow>${ic("reset",14)}Restart now</button></footer></div>`;
d.onclick=async e=>{if(e.target.closest("[data-updlater]")){d.remove();setTimeout(()=>showUpdReady(u),60*60*1000);return}if(e.target.closest("[data-updnow]")){try{await auroras.updateInstall();d.querySelector(".body small").textContent="Updating… the launcher reopens by itself."}catch(x){d.querySelector("#upd-err").textContent=errMsg(x)}}};
document.body.appendChild(d);d.querySelector("[data-updnow]").focus()}
const updAuto=()=>{if(!(window.auroras&&auroras.updateAuto))return;auroras.updateAuto(!!CFG.upd.auto).then(r=>{if(r&&r.ready)showUpdReady(r.ready)}).catch(()=>{})};
if(window.auroras&&auroras.onUpdateReady){auroras.onUpdateReady(showUpdReady);setTimeout(updAuto,1500)}
if(window.auroras&&auroras.settingsAll&&CFG.upd.auto)setTimeout(()=>auroras.settingsAll().then(s=>{if(s.updateUrl||s.releaseRepo)updCheck(true)}).catch(()=>{}),4000);

const POST={home:initHome,settings:initSettings,skins:initSkins,mods:initMods},_ri=renderInner;

/** Page headers: the page's icon in a lit tile and a one-line description under the title. */
const PAGE_SUB={home:"",instances:"Your Minecraft setups, each with its own version, mods and settings.",mods:"Find and install mods from Modrinth and CurseForge.",friends:"See who’s online, send requests and join friends.",cosmetics:"Custom skies and particles for your game.",skins:"Preview and upload your Minecraft skin.",capes:"Your cape library, editor and in-game cape.",emotes:"Play, make and arrange emotes for the in-game wheel.",totem:"Paint a custom Totem of Undying and export it as a pack.",modules:"Turn client features on and off and tune each one.",settings:"Appearance, accounts, updates and the launcher itself."};
function pageHead(){const h=document.querySelector("#main .page>.head");if(!h||h.querySelector(".ph"))return;const h1=h.querySelector("h1");if(!h1)return;const n=NAV.flatMap(g=>g[1]).find(x=>x[0]===S.page);
  const w=document.createElement("div");w.className="ph";w.innerHTML=`${n?`<span class="ph-ico" aria-hidden="true">${ic(n[2])}</span>`:""}<span class="ph-t"></span>`;h1.replaceWith(w);const tt=w.querySelector(".ph-t");tt.appendChild(h1);
  if(PAGE_SUB[S.page]){const sub=document.createElement("small");sub.className="ph-sub";sub.textContent=PAGE_SUB[S.page];tt.appendChild(sub)}}
renderInner=function(){_ri();saveInst();bgApply();pageHead();const f=POST[S.page];if(f)f()};
render();
</script>
