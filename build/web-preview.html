<!DOCTYPE html>
<html lang="en" data-theme="aurora-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auroras Launcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b0d12;--side:#0f1218;--s1:#141821;--s2:#1a1f2a;--s3:#222836;--line:#232938;--line-strong:#2f3747;--text:#e8ecf4;--mute:#8a93a6;--faint:#5d6577;--acc:#8fd3ff;--acc-ink:#06141f;--acc2:#5fd0d6;--vio:#a78bfa;--ok:#6fcf97;--warn:#e0b45a;--err:#e57373;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:40px;--r-s:6px;--r-m:10px;--r-l:14px;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-lg:15px;--fs-xl:20px;--fs-xxl:28px;--t-fast:120ms;--t:160ms;--t-slow:240ms;--ease:cubic-bezier(0.2,0.7,0.2,1);--control:32px;--control-sm:26px;--icon:16px;--switch-w:34px;--switch-h:20px;--row:44px;--sh-pop:0 18px 50px -10px #000000aa;--sh-card:0 1px 0 rgba(255,255,255,.025) inset;--sh-lift:0 10px 30px -12px #000000}
:root{--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--glow1:rgba(143,211,255,.16);--glow2:rgba(167,139,250,.12);--glow3:rgba(95,208,214,.10)}
[data-theme=midnight]{--bg:#07090f;--side:#0a0d16;--s1:#10142199;--s1:#101421;--s2:#161b2b;--line:#1d2438;--acc:#7c9cff;--acc2:#6aa8ff;--vio:#b39dff;--glow1:rgba(124,156,255,.18);--glow2:rgba(179,157,255,.10);--glow3:rgba(106,168,255,.08)}
[data-theme=arctic]{--bg:#0c1115;--side:#10171c;--s1:#151d23;--s2:#1b252d;--line:#25313b;--acc:#b8ecff;--acc2:#7fe3e0;--vio:#9fb4ff;--glow1:rgba(184,236,255,.16);--glow2:rgba(159,180,255,.08);--glow3:rgba(127,227,224,.12)}
[data-theme=nebula]{--bg:#0e0b16;--side:#130f1d;--s1:#191427;--s2:#21192f;--line:#2d2340;--acc:#c4a6ff;--acc2:#ff9bd1;--vio:#9d7cff;--glow1:rgba(196,166,255,.18);--glow2:rgba(255,155,209,.10);--glow3:rgba(157,124,255,.12)}
[data-theme=sunset]{--bg:#120c0c;--side:#171010;--s1:#1e1514;--s2:#271b19;--line:#37251f;--acc:#ffb38a;--acc2:#ff8fa3;--vio:#e5a0ff;--acc-ink:#1f0e05;--glow1:rgba(255,179,138,.17);--glow2:rgba(255,143,163,.10);--glow3:rgba(229,160,255,.08)}
[data-theme=forest]{--bg:#0a0f0d;--side:#0e1512;--s1:#131c18;--s2:#18241f;--line:#22322b;--acc:#8fe3b0;--acc2:#6fcf97;--vio:#9ad0c0;--glow1:rgba(143,227,176,.15);--glow2:rgba(154,208,192,.09);--glow3:rgba(111,207,151,.10)}
[data-theme=light]{--bg:#f5f7fa;--side:#eceff4;--s1:#ffffff;--s2:#f0f2f6;--line:#dde2eb;--text:#161a23;--mute:#667085;--acc:#2a6fa8;--acc-ink:#fff;--acc2:#1f9aa3;--vio:#7c5cd6;--ok:#2f8f5b;--warn:#a87a1c;--err:#c24444;--glow1:rgba(47,127,193,.14);--glow2:rgba(124,92,214,.08);--glow3:rgba(31,154,163,.08)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;font:400 13px/1.5 var(--font);letter-spacing:-.003em;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background var(--t),color var(--t)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r-s)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
.app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:36px 1fr;height:100%}
.titlebar{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--side);border-bottom:1px solid var(--line);color:var(--mute);font-size:12px}
.titlebar b{font-weight:500;color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--vio))}
.side{width:212px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;gap:2px;overflow-y:auto;transition:width 200ms}
.side.mini{width:56px}
.grp{font-size:11px;color:var(--mute);padding:14px 10px 4px;white-space:nowrap;overflow:hidden}
.side.mini .grp{height:10px;padding:0;margin:6px 8px 0;border-top:1px solid var(--line);font-size:0}
.side.mini .grp:first-of-type{border:0}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-s);color:var(--mute);width:100%;text-align:left;position:relative;white-space:nowrap;transition:background var(--t),color var(--t)}
.nav:hover{background:var(--s2);color:var(--text)}
.nav[aria-current=page]{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,var(--s2)),var(--s2));color:var(--text)}.nav[aria-current=page] svg{color:var(--acc)}
.nav[aria-current=page]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.side.mini .nav span{display:none}
.side.mini .nav:hover::after{content:attr(data-tip);position:fixed;left:62px;background:var(--s2);border:1px solid var(--line);color:var(--text);padding:3px 8px;border-radius:var(--r-s);font-size:12px;z-index:30}
.grow{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-m);width:100%;text-align:left;transition:background var(--t)}
.acct:hover{background:var(--s2)}
.side.mini .acct div{display:none}
.avatar{width:28px;height:28px;border-radius:var(--r-s);background:linear-gradient(135deg,var(--acc2),var(--vio));display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--acc-ink);flex:none}
/* Sidebar: a soft glass column with an aurora glow at the top, icon tiles, and an accent-lit active page. */
.side.side{padding:10px 10px 12px;gap:1px;background:radial-gradient(120% 40% at 0% 0%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--side) 82%,transparent),color-mix(in srgb,var(--side) 92%,transparent));border-right:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:inset -1px 0 0 rgba(255,255,255,.03)}
.sbrand{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;margin-bottom:2px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}.sbrand .logo{height:24px;filter:drop-shadow(0 0 10px var(--glow1))}
.sbrand span{display:grid;line-height:1.1;white-space:nowrap}.sbrand b{font-weight:650;letter-spacing:-.01em;font-size:15px}.sbrand small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.side .grp{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--mute) 75%,transparent);padding:16px 10px 6px}
.side .nav{height:38px;padding:0 8px;gap:11px;border-radius:11px;font-weight:500;transition:background var(--t),color var(--t),transform var(--t-fast,90ms)}
.nic{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--s2) 70%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);transition:background var(--t),border-color var(--t),box-shadow var(--t),color var(--t)}.nic svg{width:15px;height:15px}
.side .nav:hover{background:color-mix(in srgb,var(--s2) 70%,transparent)}.side .nav:hover .nic{border-color:var(--line-strong,var(--mute));color:var(--text)}.side .nav:active{transform:scale(.98)}
.side .nav[aria-current=page]{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 20%,transparent),color-mix(in srgb,var(--acc) 4%,transparent));color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent)}
.side .nav[aria-current=page] .nic{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));border-color:transparent;color:var(--acc-ink);box-shadow:0 4px 14px -4px var(--acc)}.side .nav[aria-current=page] svg{color:var(--acc-ink)}
.side .nav[aria-current=page]::before{left:-10px;top:10px;bottom:10px}
.side #collapse{color:var(--mute);margin-top:6px}
.side .acct{margin-top:6px;padding:8px;border-radius:14px;background:color-mix(in srgb,var(--s1) 70%,transparent);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.side .acct:hover{border-color:var(--line-strong,var(--mute));background:color-mix(in srgb,var(--s2) 75%,transparent)}
.side .acct small{color:var(--mute)}.side .acct .av,.side .acct img{border-radius:9px}
.side.mini .sbrand span{display:none}.side.mini .sbrand{justify-content:center;padding:6px 0 12px}.side.mini .nav{justify-content:center;padding:0}.side.mini .acct{justify-content:center;padding:6px}
.min{min-width:0}.min b,.min small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:var(--mute);font-size:12px}
main{position:relative;overflow-y:auto;min-width:0}
.page{max-width:980px;margin:0 auto;padding:28px 32px 96px;animation:in 180ms ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
h1{font-size:20px;font-weight:500;letter-spacing:-.02em}
h2{font-size:13px;font-weight:500;margin-bottom:10px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
.hero{position:relative;border-radius:var(--r-l);padding:44px 36px 32px;margin-bottom:28px;overflow:hidden;border:1px solid var(--line);background:var(--s1)}
.hero::before,.hero::after{content:"";position:absolute;inset:-40%;pointer-events:none;background:radial-gradient(40% 30% at 30% 40%,var(--glow1),transparent 70%),radial-gradient(35% 28% at 70% 30%,var(--glow2),transparent 70%),radial-gradient(40% 25% at 55% 75%,var(--glow3),transparent 70%);animation:drift 28s ease-in-out infinite alternate}
.hero::after{animation-duration:41s;animation-direction:alternate-reverse;opacity:.7}
@keyframes drift{to{transform:translate3d(6%,4%,0) rotate(6deg)}}
.hero>*{position:relative}
.wm{font-size:44px;line-height:1.05;font-weight:500;letter-spacing:-.04em}
.hero p{color:var(--mute);margin-top:8px;max-width:46ch}
.launch{display:flex;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:var(--r-s);display:inline-flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);font-weight:500;transition:background var(--t),transform 90ms,border-color var(--t)}
.btn:hover{border-color:var(--mute)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
/* Buttons with a little depth: a soft top light, a hairline edge and a short shadow; primary buttons glow in the accent. */
.btn{border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--s2) 90%,#fff 10%),var(--s2));border-color:color-mix(in srgb,var(--line) 85%,#fff 8%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.22)}
.btn:hover{border-color:var(--line-strong,var(--mute));background:linear-gradient(180deg,color-mix(in srgb,var(--s2) 84%,#fff 16%),var(--s2))}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 86%,#fff),var(--acc));border-color:color-mix(in srgb,var(--acc) 75%,#000);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 16px -6px var(--acc)}
.btn.pri:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 22px -6px var(--acc)}
.btn.play{height:52px;padding:0 30px;font-size:16px;font-weight:600;letter-spacing:.01em;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 88%,#fff),var(--acc) 45%,color-mix(in srgb,var(--acc) 62%,#8b5cf6));box-shadow:0 12px 34px -12px var(--acc),inset 0 1px 0 rgba(255,255,255,.4);transition:transform var(--t),box-shadow var(--t),filter var(--t)}
.btn.play:hover{transform:translateY(-1px);box-shadow:0 16px 40px -12px var(--acc),inset 0 1px 0 rgba(255,255,255,.45)}.btn.play:active{transform:translateY(0)}
.sel{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:var(--r-m);background:color-mix(in srgb,var(--s2) 80%,transparent);border:1px solid var(--line);min-width:230px;max-width:100%;text-align:left;transition:border-color var(--t)}
.sel:hover,.sel[aria-expanded=true]{border-color:var(--mute)}
.sel .min{flex:1}
.ico{width:28px;height:28px;border-radius:var(--r-s);display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--s2);border:1px solid var(--line);flex:none}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
@media(max-width:760px){.cols{grid-template-columns:1fr}.page{padding:20px 16px 96px}.hero{padding:28px 20px}.wm{font-size:34px}.side{width:56px}.side .nav span,.side .acct div{display:none}.side .grp{font-size:0;height:10px;padding:0}}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-m)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-s);width:100%;text-align:left;transition:background var(--t)}
.row:hover{background:var(--s2)}
.list{padding:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.srv{padding:var(--sp-4);display:grid;gap:var(--sp-3);align-content:start}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--sp-5);align-items:start}.homegrid h2{color:var(--mute);font-weight:500}
.sico{width:40px;height:40px;border-radius:var(--r-s);image-rendering:pixelated;flex:none}
.srvst{display:flex!important;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sdot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}.sdot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}.sdot.bad{background:var(--err)}.sdot.wait{background:var(--warn)}
.spin.sm{width:11px;height:11px;border-width:1.5px}
.motd{font-size:var(--fs-sm);color:var(--mute);white-space:pre-line;line-height:1.45;max-height:3.2em;overflow:hidden;padding:var(--sp-2) var(--sp-3);background:var(--bg);border-radius:var(--r-s);border:1px solid var(--line)}
.srvrow{display:flex;align-items:center;gap:var(--sp-2)}.srvrow .addr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 var(--fs-sm)/1 ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.srvform{display:flex;gap:var(--sp-2)}.srv .top small{white-space:normal}.srv .top .srvst{white-space:nowrap}
.news .row{gap:var(--sp-3)}.news b{font-weight:500;white-space:normal;display:block}.dotk{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-top:7px;flex:none;opacity:.8}
.srv .top{display:flex;align-items:center;gap:12px}
.srv .ico{width:40px;height:40px;background:linear-gradient(135deg,var(--vio),var(--acc2));color:var(--acc-ink);border:0;font-size:15px}
input.f{width:100%;height:32px;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--line);padding:0 10px;transition:border-color var(--t)}
input.f:focus{border-color:var(--acc);outline:0}
input.f::placeholder{color:var(--mute)}
.search{position:relative}.search svg{position:absolute;left:10px;top:8px;color:var(--mute)}.search input{padding-left:32px}
.news{display:grid;gap:2px;padding:4px}
.news .row{align-items:flex-start}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:72px 20px;color:var(--mute)}
.empty .ring{width:44px;height:44px;border-radius:var(--r-m);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:6px;background:var(--s1)}
.empty b{color:var(--text);font-weight:500;font-size:14px}
.bar{position:fixed;left:calc(50% + 106px);transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border-radius:var(--r-l);background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);z-index:5;box-shadow:0 10px 30px -12px #000}
.bar .sel{height:36px;min-width:190px;background:transparent;border:0}
.bar .btn{height:36px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.th{border-radius:var(--r-m);border:1px solid var(--line);background:var(--s1);padding:8px;text-align:left;transition:border-color var(--t)}
.th:hover{border-color:var(--mute)}
.th[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pv{height:64px;border-radius:var(--r-s);position:relative;overflow:hidden;margin-bottom:8px;border:1px solid #ffffff10}
.pv i{position:absolute;left:0;top:0;bottom:0;width:22%}
.pv b{position:absolute;right:10px;bottom:10px;width:34px;height:10px;border-radius:5px}
.th span{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.tg{width:38px;height:22px;border-radius:99px;background:color-mix(in srgb,var(--bg) 55%,var(--s2));border:1px solid var(--line);position:relative;transition:background var(--t);flex:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--mute) 70%,#fff);box-shadow:0 1px 3px rgba(0,0,0,.45);transition:transform var(--t) var(--ease,ease),background var(--t)}
.tg[aria-checked=true]{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));border-color:transparent;box-shadow:0 0 12px -3px var(--acc)}.tg[aria-checked=true]::after{transform:translateX(16px);background:#fff}
.pop{position:fixed;width:320px;max-width:calc(100vw - 24px);background:var(--s1);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 18px 50px -10px #000a;z-index:40;padding:8px;animation:pop 140ms ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}}
.pop .scroll{max-height:240px;overflow-y:auto;margin:8px -2px}
.pop .row[aria-selected=true]{background:var(--s2)}
.pop .check{margin-left:auto;color:var(--acc)}
.toast{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--s2);border:1px solid var(--line);padding:10px 14px;border-radius:var(--r-m);max-width:320px;animation:pop 160ms ease-out;box-shadow:0 12px 30px -10px #000a}
.tot{display:grid;grid-template-columns:64px auto 220px;gap:20px;align-items:start;justify-content:start}
@media(max-width:860px){.tot{grid-template-columns:1fr}.tb{flex-direction:row!important;flex-wrap:wrap}}
.tb{display:flex;flex-direction:column;gap:2px;padding:6px}
.tb{align-items:center}.tb .ibtn{position:relative}.tbsep{display:block;width:20px;height:1px;background:var(--line);margin:4px 0}

.page>*{animation:rise .45s cubic-bezier(.2,.75,.2,1) both}.page>*:nth-child(2){animation-delay:.04s}.page>*:nth-child(3){animation-delay:.08s}.page>*:nth-child(4){animation-delay:.12s}.page>*:nth-child(n+5){animation-delay:.16s}
.instgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.icard{position:relative;display:grid;gap:12px;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--line) 70%,rgba(255,255,255,.07));background:linear-gradient(180deg,color-mix(in srgb,var(--s1) 80%,transparent),color-mix(in srgb,var(--s1) 68%,transparent));backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 44px -26px rgba(0,0,0,.85);transition:border-color var(--t),transform var(--t),box-shadow var(--t)}
.icard:hover{transform:translateY(-2px);border-color:var(--line-strong,var(--mute))}.icard.on{border-color:color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent),0 20px 50px -24px var(--acc)}
.icard-main{display:flex;align-items:center;gap:12px;text-align:left;width:100%}.icard-main .min{flex:1;display:grid}.icard-main b{font-size:15px;font-weight:600}.icard-main small{color:var(--mute)}
.ibig{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none;background:linear-gradient(135deg,var(--acc2,var(--acc)),var(--vio,var(--acc)));color:var(--acc-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px -10px var(--acc)}
.icard-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px}.icard-meta span{display:inline-flex;align-items:center;gap:6px}
.icard-act{display:flex;justify-content:flex-end;gap:8px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.modcard{border-radius:16px;padding:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--s1) 80%,transparent),color-mix(in srgb,var(--s1) 68%,transparent));backdrop-filter:blur(16px);border-color:color-mix(in srgb,var(--line) 70%,rgba(255,255,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 36px -24px rgba(0,0,0,.8)}
.modcard:hover{border-color:var(--line-strong,var(--mute));transform:translateY(-1px)}.modcard .mico{width:36px;height:36px;border-radius:11px}.modcard:not(.na) .mico{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 16px -8px var(--acc)}
.modcard .tag{font-size:10.5px;padding:1px 8px}.modcard .mbot{padding-top:10px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.privacy{display:grid;gap:12px}.privrow{display:flex;gap:12px;align-items:flex-start}.privrow .nic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok,#3ecf8e) 16%,transparent);color:var(--ok,#3ecf8e)}.privrow .min{flex:1;min-width:0}.privrow .min b,.privrow .min small{white-space:normal;overflow:visible;text-overflow:clip}.privrow b{font-weight:550;display:block}.privrow small{display:block;margin-top:2px}.privrow.warn .nic{background:color-mix(in srgb,#f5a524 16%,transparent);color:#f5a524}
@media(max-width:1100px){.side{width:56px}.side .nav span,.side .acct .min,.side .nav .badge,.sbrand span{display:none}.sbrand{justify-content:center;padding:6px 0 12px}.side .nav{justify-content:center;padding:0}.side .acct{justify-content:center;padding:6px}.side .grp{height:10px;padding:0;margin:6px 8px 0;border-top:1px solid var(--line);font-size:0}.side .grp:first-of-type{border:0}
 .side .nav:hover::after{content:attr(data-tip);position:fixed;left:62px;background:var(--s2);border:1px solid var(--line);color:var(--text);padding:3px 8px;border-radius:var(--r-s);font-size:12px;z-index:30}.bar{left:calc(50% + 28px)}#collapse{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function PetalSys(pal){let a=[];return{init(o,n){a=Array.from({length:Math.round(n*o.dens)},()=>({x:Math.random()*o.w*1.2-o.w*.1,y:Math.random()*o.h,z:Math.random(),ph:Math.random()*6.3,r:Math.random()*6.3,vr:rnd(-1.2,1.2),c:pal[(Math.random()*pal.length)|0]}))},

/** Updates from this copy's GitHub releases (set by the release workflow). Returns true when that source handled the check. */

const parts=[];if(r.launcher){parts.push(`<div><b style="font-weight:500">Launcher ${esc(r.launcher.version)} is available</b> <span class="tag">${esc(r.launcher.channel)}</span><br><small>${esc(r.launcher.notes||"No release notes.")}</small><br><button class="btn" data-ext="${esc(r.launcher.url)}" style="margin-top:6px">Download installer</button> <small>Launcher installs are manual for now.</small></div>`)}else parts.push(`<small>The launcher is up to date.</small>`);
const c=r.client;if(c.status==="available"){parts.push(`<div style="margin-top:12px"><b style="font-weight:500">Auroras Client ${esc(c.build.version)} for ${esc(cur().mc)} · ${esc(cur().loader)}</b><br><small>${esc(c.build.notes||"No release notes.")}</small><br><button class="btn pri" data-instclient style="margin-top:6px">Install update</button> <small>Your settings and HUD layouts are backed up first. Restart Minecraft afterwards.</small></div>`);window.__clientBuild=c.build}
else if(c.status==="up-to-date")parts.push(`<small style="display:block;margin-top:8px">Auroras Client is up to date (${esc(c.version)}).</small>`);else parts.push(`<small style="display:block;margin-top:8px">${esc(c.reason)}.</small>`);
if(silent&&(r.launcher||c.status==="available"))toast("An Auroras update is available. See Settings.");if(!silent)say(parts.join(""))}

/* ----- Auroras UI kit: shared controls and states. Visuals come from the component styles in page.html,
   which use the tokens in visuals/design-tokens.json. Every builder returns HTML; kitWire() attaches behaviour. ----- */
const UI={
  /** Segmented control for a few mutually exclusive choices. opts: [[value,label],...] */
  seg(attrs,opts,value,aria){return `<div class="seg" role="radiogroup" aria-label="${esc(aria||"")}" ${attrs} data-value="${esc(value)}">${opts.map(([v,l])=>`<button type="button" role="radio" aria-checked="${String(v)===String(value)}" tabindex="${String(v)===String(value)?0:-1}" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div>`},
  /** Slider with an editable number beside it. */
  range(attrs,{min,max,step,value,id,aria,suffix=""}){const f=fillPct(value,min,max);return `<input type="range" class="rng" ${id?`id="${id}"`:""} ${attrs} min="${min}" max="${max}" step="${step}" value="${esc(value)}" style="--fill:${f}%" aria-label="${esc(aria||"")}"><input class="num" type="number" min="${min}" max="${max}" step="${step}" value="${esc(fmtNum(value,step))}" aria-label="${esc((aria||"")+" value")}" tabindex="-1">${suffix?`<small>${esc(suffix)}</small>`:""}`},
  /** Color picker: swatch plus hex field (RRGGBB, no #). */
  color(attrs,hex,id,aria){return `<span class="colorpick"><input type="color" ${id?`id="${id}"`:""} ${attrs} value="#${esc(String(hex).toLowerCase())}" aria-label="${esc(aria||"")}"><input class="hex" value="${esc(String(hex).toUpperCase())}" maxlength="6" spellcheck="false" aria-label="${esc((aria||"")+" hex value")}"></span>`},
  tip(text,cls=""){return text?`<span class="tip ${cls}" tabindex="0" role="note" aria-label="${esc(text)}" data-tip="${esc(text)}">${ic("info")}</span>`:""},
  /** Loading, empty, error, success or unavailable state. */
  state(kind,title,body,action,icon){const ico=icon||({loading:"",error:"alert",ok:"check",unavail:"lock",empty:"search"})[kind]||"info";
    return `<div class="state ${kind}${action&&action.compact?" compact":""}" role="${kind==="error"?"alert":"status"}"><div class="ring">${kind==="loading"?`<span class="spin" aria-hidden="true"></span>`:ic(ico,18)}</div><b>${esc(title)}</b>${body?`<span>${body}</span>`:""}${action&&action.label?`<button class="btn" ${action.attrs||""}>${esc(action.label)}</button>`:""}</div>`},
  /** Collapsible settings section. */
  sect(title,body,{open=true,note="",count}={}){return `<details class="sect"${open?" open":""}><summary>${esc(title)}${count!=null?` <small>${count}</small>`:""}<span class="chev">${ic("down",14)}</span></summary><div class="body">${note?`<div class="note">${note}</div>`:""}${body}</div></details>`},
  /** Module header: icon, name, one-line description, status tags, optional control on the right. */
  head(icon,title,desc,tags,right){return `<div class="mhead"><div class="mic">${ic(icon,18)}</div><div class="mt2"><b>${esc(title)}</b>${desc?`<small>${desc}</small>`:""}${tags?`<div class="tags">${tags}</div>`:""}</div>${right||""}</div>`}
};
const fillPct=(v,min,max)=>Math.max(0,Math.min(100,(+v-min)/((max-min)||1)*100)).toFixed(1);
const fmtNum=(v,step)=>{const s=+step;if(s>=1)return String(Math.round(+v));const d=Math.min(4,(String(step).split(".")[1]||"").length||1);return (+v).toFixed(d)};
/** Attaches behaviour to kit controls inside root: segmented keyboard/mouse, slider fill + number sync, hex sync. */
function kitWire(root,onChange){
  root.querySelectorAll(".seg").forEach(g=>{const pick=b=>{if(!b||b.disabled)return;g.dataset.value=b.dataset.v;g.querySelectorAll("button").forEach(x=>{const on=x===b;x.setAttribute("aria-checked",on);x.tabIndex=on?0:-1});onChange&&onChange(g)};
    g.onclick=e=>pick(e.target.closest("button"));
    g.onkeydown=e=>{const bs=[...g.querySelectorAll("button")],i=bs.findIndex(x=>x.getAttribute("aria-checked")==="true");let n=-1;
      if(e.key==="ArrowRight"||e.key==="ArrowDown")n=(i+1)%bs.length;else if(e.key==="ArrowLeft"||e.key==="ArrowUp")n=(i-1+bs.length)%bs.length;else if(e.key==="Home")n=0;else if(e.key==="End")n=bs.length-1;
      if(n>=0){e.preventDefault();pick(bs[n]);bs[n].focus()}}});
  root.querySelectorAll("input.rng").forEach(r=>{const num=(r.id&&root.querySelector(`[data-numfor="${r.id}"]`))||(r.nextElementSibling&&r.nextElementSibling.classList.contains("num")?r.nextElementSibling:null);
    const sync=()=>{r.style.setProperty("--fill",fillPct(r.value,+r.min,+r.max)+"%");if(num&&document.activeElement!==num)num.value=fmtNum(r.value,r.step)};

/**
 * One game tick (1/20 s) of the preview player, using Minecraft's own movement numbers: speed in blocks per tick (1 on the
 * slider = sprinting, 0.28; about 0.77 = walking, 0.216; sneaking is 0.3 of that), the stride and walk distance that drive
 * the cape flap (PlayerEntity: stride eases 40% a tick toward min(0.1, speed)), and the limb swing (LivingEntity: limb
 * distance eases toward min(1, speed x 4)). Rendering then interpolates between the last two ticks, as the game does.
 */

  const speed=moving?0.28*CS.stride*(CS.sneak?0.3:1):0;CS.pos+=speed;CS.phase+=speed*0.6;
  S.strideD+=(Math.min(0.1,speed)-S.strideD)*0.4;S.limbD+=(Math.min(1,speed*4)-S.limbD)*0.4;S.limbP+=S.limbD;
  CS.sim.tick(0,64,CS.pos,0,CS.sneak,S.strideD,CS.phase);
  // Minecraft snaps into the sneaking pose; easing it over about three ticks keeps the preview from jumping.
  S.crouch+=((CS.sneak?1:0)-S.crouch)*(REDUCED()?1:0.55);if(Math.abs((CS.sneak?1:0)-S.crouch)<0.01)S.crouch=CS.sneak?1:0;

const WHEEL_SEG=(i,ro,ri)=>{const a0=(i*45-22.5+1.6)*Math.PI/180,a1=(i*45+22.5-1.6)*Math.PI/180,P=(r,a)=>[(120+Math.sin(a)*r).toFixed(2),(120-Math.cos(a)*r).toFixed(2)];
  const [x0,y0]=P(ro,a0),[x1,y1]=P(ro,a1),[x2,y2]=P(ri,a1),[x3,y3]=P(ri,a0);return `M${x0} ${y0}A${ro} ${ro} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 0 0 ${x3} ${y3}Z`};

    <text x="${lx.toFixed(1)}" y="${(ly-7).toFixed(1)}" class="wn">${i+1}</text><text x="${lx.toFixed(1)}" y="${(ly+7).toFixed(1)}" class="wl">${em?esc(em.name.length>11?em.name.slice(0,10)+"…":em.name):"Empty"}</text></g>`}).join("")}
    <circle cx="120" cy="120" r="50" class="whub"/></svg><canvas class="whubcv" width="84" height="84" aria-hidden="true"></canvas><div class="whubtxt">${ES.slot!=null?`Slot ${ES.slot+1}${hub?"":" · empty"}`:`Hold ${esc(keyName2((mcVals()||{})["emotes.wheelKey"]||66))}`}</div>`;

function emSkin(){const a=curAcct(),key=a?a.uuid+":"+(a.skin?a.skin.length:0):"default";if(ES.skinKey!==key){ES.skinKey=key;ES.skin=null;const done=img=>{try{ES.skin=texOf(img?skinCanvas(img):defaultSkin())}catch(e){ES.skin=texOf(defaultSkin())}};if(a&&a.skin){const im=new Image();im.onload=()=>done(im);im.onerror=()=>done(null);im.src=a.skin}else done(null)}return ES.skin}

  if(ES.tab==="creator"){const d=curDraft();if(ES.cplay&&d&&!REDUCED()){ES.head+=dt*ES.speed;if(ES.head>d.duration){if(d.loop)ES.head%=d.duration;else{ES.head=d.duration;ES.cplay=false;drawEmCtrls()}}drawTimeline()}

  else{ES.ctrl.update(now);if(!ES.ctrl.playing()&&ES.repeat&&!REDUCED()){if(!ES.endAt)ES.endAt=now;else if(now-ES.endAt>0.6)playEmote(ES.sel,false)}ES.ctrl.sample(now,ES.w,ES.wt);for(let i=0;i<28;i++)ES.pose[i]=ES.w[i]*ES.wt[i>>2];
    const em=emoteById(ES.sel);label=em?esc(em.name)+(ES.ctrl.playing()?"":ES.ctrl.lastEnd==="finished"?" · finished":" · stopped"):""}

  const tag=$("#em-tag");if(tag&&tag.textContent!==label)tag.textContent=label;

const blankEmote=()=>({id:uniqueId("my_emote"),name:"My emote",category:"Custom",duration:2,loop:false,keys:{rightArm:[{t:0},{t:1,p:-120,e:"easeInOut"},{t:2,e:"easeInOut"}]}});

function loadDraft(json){ES.draft=JSON.parse(JSON.stringify(json));ES.hist=[];ES.fut=[];ES.key=null;ES.head=0;ES.cerr="";ES.part=Object.keys(json.keys||{})[0]||"rightArm";validateDraft()}

function drawEmoteCreator(b){if(!b)return;const d=ES.draft;

  <div class="stagebox" style="height:150px;cursor:pointer"><canvas id="ec-tl" aria-label="Timeline: click to move the playhead, click a keyframe to select it"></canvas></div>
  <div class="row2"><button class="btn" data-cc="add">Add keyframe at playhead</button><button class="btn" data-cc="delk">Delete keyframe</button><button class="btn" data-cc="undo" aria-label="Undo">Undo</button><button class="btn" data-cc="redo" aria-label="Redo">Redo</button></div>
  <div id="ec-key"></div><div class="err" id="ec-err" role="alert"></div>
  <div class="row2" style="justify-content:flex-end"><button class="btn" data-cc="new">New</button><label class="btn" style="cursor:pointer">Import<input type="file" id="ec-imp" accept=".json,application/json" hidden></label><button class="btn" data-cc="export">Export</button><button class="btn pri" data-cc="save">Save emote</button></div>
  <small style="display:block;margin-top:6px">${isDesk()?"Saved into "+esc(cur().name)+"’s emotes folder, which the game reads when it starts.":"Web preview: saved in this browser only."} Angles follow Minecraft’s model: negative pitch raises a limb forward; positive roll swings the right arm out, negative the left.</small>`;
  const fld=(id,fn)=>{$(id).onchange=e=>edit(d2=>fn(d2,e.target))};
  fld("#ec-name",(d2,t)=>{d2.name=t.value});fld("#ec-id",(d2,t)=>{d2.id=t.value.trim()});fld("#ec-dur",(d2,t)=>{d2.duration=+t.value});
  $("#ec-loop").onclick=e=>{const v=e.currentTarget.getAttribute("aria-checked")!=="true";e.currentTarget.setAttribute("aria-checked",v);edit(d2=>{d2.loop=v})};

    else if(a==="undo")undo();else if(a==="redo")redo();else if(a==="new"){newDraft();drawEmoteCreator(b)}

  const tl=$("#ec-tl");tl.onclick=e=>{const r=tl.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,L=tlLayout(tl);const row=Math.floor((y-L.top)/L.rowH);
    if(row>=0&&row<EPARTS.length){const p=EPARTS[row],ks=ES.draft.keys[p]||[];const hit=ks.findIndex(k=>Math.abs(L.x(k.t)-x)<6);if(hit>=0){ES.part=p;ES.key=hit;ES.head=ks[hit].t;document.querySelectorAll("#ec-parts .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.part===p));drawTimeline();drawKeyPanel();return}}
    ES.head=Math.max(0,Math.min(curDraft()?curDraft().duration:ES.draft.duration,(x-L.left)/L.w*(curDraft()?curDraft().duration:ES.draft.duration)));ES.key=null;drawTimeline();drawKeyPanel()};
  drawCreatorHead();drawTimeline();drawKeyPanel()}
function drawCreatorHead(){const h=$("#ec-err");if(h)h.textContent=ES.cerr?"Can’t use this emote yet: "+ES.cerr:""}
function addKey(){const p=ES.part,d=curDraft(),pi=EPARTS.indexOf(p),tmp=new Float64Array(28);if(d)VX.emotePose(d,ES.head,tmp);const t=Math.round(ES.head*100)/100;

  // Shared slider rows (filled track plus a typed value, clamped to the range), like every other settings panel.
  const sl=(f,lab,min,max,step)=>{const v=k[f]||0;return `<div class="srow sl" data-row="${f}"><div class="lab"><label for="ek-${f}">${lab}</label></div><div class="ctl"><input class="num" type="number" min="${min}" max="${max}" step="${step}" value="${esc(fmtNum(v,step))}" aria-label="${lab} value" data-numfor="ek-${f}"></div><input type="range" class="rng" id="ek-${f}" data-kf="${f}" min="${min}" max="${max}" step="${step}" value="${v}" style="--fill:${fillPct(v,min,max)}%" aria-label="${lab}"></div>`};
  const dur=curDraft()?curDraft().duration:+ES.draft.duration||30;
  el.innerHTML=`<div class="panel">${ES.part==="root"?sl("oy","Height (pixels, negative is up)",-16,16,0.5):sl("p","Pitch (°)",-180,180,1)+sl("y","Yaw (°)",-180,180,1)+sl("r","Roll (°)",-180,180,1)}

    if(!pushed){ES.hist.push(JSON.stringify(ES.draft));if(ES.hist.length>100)ES.hist.shift();ES.fut=[];pushed=true}
    if(v)kk[f]=v;else delete kk[f];if(ES.cplay){ES.cplay=false;drawEmCtrls()}ES.head=kk.t;validateDraft();drawCreatorHead();drawTimeline()});

    if(f==="e")edit(()=>{const kk=partKeys()[ES.key];if(t.value==="linear")delete kk.e;else kk.e=t.value});

      if(partKeys().some((x,i)=>i!==ES.key&&Math.abs(x.t-v)<0.005)){toast("There’s already a keyframe at "+v+" s for "+EPART_LABEL[ES.part].toLowerCase()+".");t.value=k.t;return}
      edit(d2=>{const l=d2.keys[ES.part],kk=l[ES.key];kk.t=v;l.sort((a,b)=>a.t-b.t);ES.key=l.indexOf(kk)});ES.head=v;drawTimeline();drawKeyPanel()}}}
const tlLayout=c=>{const left=86,right=12,top=8,rowH=(c.height-top-6)/EPARTS.length,d=curDraft()?curDraft().duration:Math.max(0.1,+ES.draft.duration||1),w=c.width-left-right;return{left,top,rowH,w,d,x:t=>left+t/d*w}};
function drawTimeline(){const c=$("#ec-tl");if(!c)return;const W=c.clientWidth|0,H=c.clientHeight|0;if(c.width!==W||c.height!==H){c.width=W;c.height=H}const x=c.getContext("2d"),L=tlLayout(c),cs=getComputedStyle(document.body);
  x.clearRect(0,0,W,H);x.font="11px system-ui,sans-serif";x.textBaseline="middle";
  EPARTS.forEach((p,i)=>{const y=L.top+i*L.rowH;if(p===ES.part){x.fillStyle="rgba(111,227,255,.08)";x.fillRect(0,y,W,L.rowH)}x.fillStyle=p===ES.part?cs.getPropertyValue("--text")||"#fff":cs.getPropertyValue("--mute")||"#999";x.fillText(EPART_LABEL[p].replace(" (height)",""),8,y+L.rowH/2);
    x.strokeStyle="rgba(255,255,255,.08)";x.beginPath();x.moveTo(L.left,y+L.rowH/2);x.lineTo(L.left+L.w,y+L.rowH/2);x.stroke();
    (ES.draft.keys[p]||[]).forEach((k,j)=>{const kx=L.x(Math.min(k.t,L.d)),ky=y+L.rowH/2,sel=p===ES.part&&j===ES.key;x.fillStyle=sel?"#6fe3ff":"#b58cff";x.beginPath();x.moveTo(kx,ky-5);x.lineTo(kx+5,ky);x.lineTo(kx,ky+5);x.lineTo(kx-5,ky);x.closePath();x.fill()})});
  for(let s=0;s<=L.d+1e-9;s+=L.d>6?1:0.5){const sx=L.x(s);x.fillStyle="rgba(255,255,255,.25)";x.fillRect(sx,H-5,1,5)}drawPlayhead()}
function drawPlayhead(){const c=$("#ec-tl");if(!c)return;const x=c.getContext("2d"),L=tlLayout(c),px=L.x(Math.min(ES.head,L.d));x.fillStyle="#ffffff";x.fillRect(Math.round(px),0,1.5,c.height)}

/* ----- Friends: real friends through your own Auroras friends server (friends-server/). Nothing here is simulated. ----- */
const FR={data:null,err:"",loading:false,url:"",checked:false,timer:0,seq:0,busy:""};
const frDesk=()=>!!(window.auroras&&auroras.friendsOverview);
const frAcct=()=>{const a=curAcct();return a&&!a.preview?a:null};
/** A friend's status in words, and the dot colour class. */
function frStatus(f){if(f.state==="playing")return[f.server?"Playing on "+f.server:"Playing Minecraft"+(f.instance?" · "+f.instance:""),"play"];if(f.state==="online")return["In the launcher","on"];if(f.state==="away")return["Away","away"];
  if(!f.lastSeen)return["Offline","off"];const m=Math.round((Date.now()-Date.parse(f.lastSeen))/60000);return["Offline · seen "+(m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"),"off"]}
const frHue=u=>parseInt(String(u).slice(0,6),16)%360;
const frAv=(f,dot)=>`<span class="frav" style="--h:${frHue(f.uuid)}">${esc(f.name[0]).toUpperCase()}${dot?`<i class="frdot s-${dot}" aria-hidden="true"></i>`:""}</span>`;
PAGES.friends=()=>`<div class="page friends" style="max-width:900px"><div class="head"><h1>Friends</h1><span class="fr-me" id="fr-me"></span></div><div id="fr-body">${frBody()}</div></div>`;
function frBody(){
  if(!frDesk())return `<div class="panel">${UI.state("unavail","Friends needs the desktop app","Friends signs in with your Minecraft account through the Auroras desktop app.",null,"users")}</div>`;
  if(!FR.checked)return `<div class="panel">${UI.state("loading","Loading friends…","",null)}</div>`;
  if(!FR.url)return `<div class="panel fr-setup"><b>Friends needs an Auroras friends server</b><small>The server is in the <code>friends-server</code> folder of this project: one small Node program with no dependencies. Run it on any host with HTTPS and enter its address here. To build it into every installer, set the <code>FRIENDS_URL</code> repository variable instead.</small>
<form class="fr-form" data-frurl><input class="f" id="fr-url" placeholder="https://friends.example.net" autocomplete="off" spellcheck="false" aria-label="Friends server address"><button class="btn pri" type="submit">Save</button></form><div class="err" id="fr-urlerr" role="alert"></div></div>`;
  const a=frAcct();if(!a)return `<div class="panel">${UI.state("empty","Sign in with Microsoft to use Friends","Friends proves who you are with your Minecraft account, so preview-only accounts can’t use it.",{label:"Add account",attrs:"data-add"},"users")}</div>`;
  if(FR.err&&!FR.data)return `<div class="panel">${UI.state("error","Couldn’t reach your friends",esc(FR.err),{label:"Try again",attrs:"data-frretry"})}</div>`;
  if(!FR.data)return `<div class="panel">${UI.state("loading","Signing in to friends…","Checking your Minecraft account with Mojang.",null)}</div>`;
  const d=FR.data,on=d.friends.filter(f=>f.state!=="offline"),off=d.friends.filter(f=>f.state==="offline"),playing=PL.state==="playing";
  const row=f=>{const[st,dot]=frStatus(f);return `<div class="frrow">${frAv(f,dot)}<span class="min"><b>${esc(f.name)}</b><small>${esc(st)}</small></span><span class="fract">
${f.state==="playing"&&f.server?`<button class="btn pri sm" data-frjoin="${esc(f.server)}">${ic("play",13)}Join</button>`:""}${playing?`<button class="btn sm" data-fract="invite" data-u="${f.uuid}">Invite</button>`:""}<button class="ibtn sm danger" data-frrm="${f.uuid}" data-name="${esc(f.name)}" aria-label="Remove ${esc(f.name)}" data-tt="Remove">${ic("trash",13)}</button></span></div>`};
  return `${FR.err?`<div class="err" role="alert" style="margin-bottom:10px">${esc(FR.err)}</div>`:""}
<form class="panel fr-add" data-fradd><span class="frico">${ic("plus",16)}</span><input class="f" id="fr-name" placeholder="Add a friend by Minecraft username" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Minecraft username"><button class="btn pri" type="submit">Send request</button></form><div class="err" id="fr-adderr" role="alert"></div>
${d.invites.length?`<h2>Invites</h2><div class="panel frlist">${d.invites.map(v=>`<div class="frrow">${frAv(v,"play")}<span class="min"><b>${esc(v.name)} invited you</b><small>to ${esc(v.server)}</small></span><span class="fract"><button class="btn pri sm" data-frjoin="${esc(v.server)}">${ic("play",13)}Join</button></span></div>`).join("")}</div>`:""}
${d.incoming.length?`<h2>Requests <span class="count">${d.incoming.length}</span></h2><div class="panel frlist">${d.incoming.map(r=>`<div class="frrow">${frAv(r)}<span class="min"><b>${esc(r.name)}</b><small>Wants to be friends</small></span><span class="fract"><button class="btn pri sm" data-fract="accept" data-u="${r.uuid}">Accept</button><button class="btn ghost sm" data-fract="decline" data-u="${r.uuid}">Decline</button></span></div>`).join("")}</div>`:""}
<h2>Online <span class="count">${on.length}</span></h2><div class="panel frlist">${on.length?on.map(row).join(""):`<div class="frempty"><small>${d.friends.length?"None of your friends are online right now.":"Add friends by their Minecraft username. They need to open Friends in Auroras once."}</small></div>`}</div>
${off.length?`<h2>Offline <span class="count">${off.length}</span></h2><div class="panel frlist">${off.map(row).join("")}</div>`:""}
${d.outgoing.length?`<h2>Sent</h2><div class="panel frlist">${d.outgoing.map(r=>`<div class="frrow">${frAv(r)}<span class="min"><b>${esc(r.name)}</b><small>Request sent</small></span><span class="fract"><button class="btn ghost sm" data-fract="cancel" data-u="${r.uuid}">Cancel</button></span></div>`).join("")}</div>`:""}`}
function frDraw(){const b=$("#fr-body");if(!b)return;const keep=$("#fr-name")?.value||"";b.innerHTML=frBody();const n=$("#fr-name");if(n&&keep)n.value=keep;const me=$("#fr-me");if(me)me.innerHTML=FR.data?`${frAv(FR.data.me,PL.state==="playing"?"play":"on")}<small>Signed in as <b>${esc(FR.data.me.name)}</b></small>`:""}
async function frLoad(){if(!frDesk())return frDraw();const n=++FR.seq;
  if(!FR.checked){try{const s=await auroras.friendsState();FR.url=s.url}catch(e){FR.url=""}FR.checked=true}
  const a=frAcct();if(!FR.url||!a){FR.data=null;return frDraw()}
  if(FR.acct!==a.uuid){FR.data=null;FR.err="";FR.acct=a.uuid;frDraw()}
  try{const d=await auroras.friendsOverview(a.uuid);if(n!==FR.seq)return;FR.data=d;FR.err=""}catch(e){if(n!==FR.seq)return;const m=errMsg(e);if(/NO_FRIENDS_SERVER/.test(m)){FR.url="";FR.data=null}else FR.err=m}
  frDraw();frBadge()}
/** Incoming requests show as a count on the sidebar. */
function frBadge(){const el=document.querySelector('.nav[data-go="friends"]');if(!el)return;let b=el.querySelector(".frn");const n=FR.data?FR.data.incoming.length+FR.data.invites.length:0;if(!n){b&&b.remove();return}if(!b){b=document.createElement("i");b.className="badge frn";el.appendChild(b)}b.textContent=n}
async function frAct(action,arg){const a=frAcct();if(!a||FR.busy)return false;FR.busy=action;try{const r=await auroras.friendsAct({uuid:a.uuid,action,arg});
  if(action==="request")toast(r.friend?"You and "+r.friend+" are now friends.":"Friend request sent to "+r.sent+".","ok");else if(action==="accept")toast("You and "+r.friend+" are now friends.","ok");else if(action==="invite")toast("Invite sent.","ok");
  FR.busy="";await frLoad();return true}catch(e){const m=errMsg(e);if(action==="request"){const er=$("#fr-adderr");if(er)er.textContent=m}else toast(m,"err");return false}finally{FR.busy=""}}
function initFriends(){frLoad();clearInterval(FR.timer);FR.timer=setInterval(()=>{if(S.page!=="friends")return clearInterval(FR.timer);if(!document.hidden)frLoad()},20000);
  const page=document.querySelector(".page");
  page.onsubmit=async e=>{e.preventDefault();if(e.target.matches("[data-fradd]")){const v=$("#fr-name").value.trim();$("#fr-adderr").textContent="";if(await frAct("request",v)){const n=$("#fr-name");if(n)n.value=""}}
    else if(e.target.matches("[data-frurl]")){const v=$("#fr-url").value.trim(),er=$("#fr-urlerr");er.textContent="";try{await auroras.setSettings({friendsUrl:v});FR.checked=false;await frLoad()}catch(x){er.textContent=errMsg(x)}}};
  page.onclick=e=>{const t=e.target.closest("[data-fract],[data-frjoin],[data-frrm],[data-frretry]");if(!t)return;
    if(t.dataset.fract)frAct(t.dataset.fract,t.dataset.u);else if(t.dataset.frjoin)doPlay({server:t.dataset.frjoin});else if(t.hasAttribute("data-frretry")){FR.err="";FR.data=null;frDraw();frLoad()}
    else if(t.dataset.frrm)confirmDlg(`Remove ${t.dataset.name}?`,"You’ll stop seeing each other online. You can add each other again later.","Remove",()=>frAct("remove",t.dataset.frrm))}}
POST.friends=initFriends;
/* Presence: while the launcher is open with a Microsoft account, tell the friends server you're online (the desktop side
   adds "playing" and the server while a game runs). Only after you've opened Friends once in this session. */
setInterval(()=>{const a=frAcct();if(frDesk()&&FR.url&&a&&FR.acct===a.uuid)auroras.friendsPresence({uuid:a.uuid,state:document.hidden?"away":"online"}).catch(()=>{})},60000);


/** Page headers: the page's icon in a lit tile and a one-line description under the title. */
const PAGE_SUB={home:"",instances:"Your Minecraft setups, each with its own version, mods and settings.",mods:"Find and install mods from Modrinth and CurseForge.",friends:"See who’s online, send requests and join friends.",cosmetics:"Custom skies and particles for your game.",skins:"Preview and upload your Minecraft skin.",capes:"Your cape library, editor and in-game cape.",emotes:"Play, make and arrange emotes for the in-game wheel.",totem:"Paint a custom Totem of Undying and export it as a pack.",modules:"Turn client features on and off and tune each one.",settings:"Appearance, accounts, updates and the launcher itself."};
function pageHead(){const h=document.querySelector("#main .page>.head");if(!h||h.querySelector(".ph"))return;const h1=h.querySelector("h1");if(!h1)return;const n=NAV.flatMap(g=>g[1]).find(x=>x[0]===S.page);
  const w=document.createElement("div");w.className="ph";w.innerHTML=`${n?`<span class="ph-ico" aria-hidden="true">${ic(n[2])}</span>`:""}<span class="ph-t"></span>`;h1.replaceWith(w);const tt=w.querySelector(".ph-t");tt.appendChild(h1);
  if(PAGE_SUB[S.page]){const sub=document.createElement("small");sub.className="ph-sub";sub.textContent=PAGE_SUB[S.page];tt.appendChild(sub)}}
renderInner=function(){_ri();saveInst();bgApply();pageHead();const f=POST[S.page];if(f)f()};
render();
</script>
